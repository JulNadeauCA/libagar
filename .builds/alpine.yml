image: alpine/edge
packages:
  - meson
  - ninja
  - clang
  - make
  - pkgconf
  - musl-dev
  - freetype-dev
  - fontconfig-dev
  - sdl2-dev
  - mesa-dev
  - glu-dev
  - libxinerama-dev
  - jpeg-dev
  - libpng-dev
  - zlib-dev

sources:
  - "https://github.com/JulNadeauCA/libagar"

tasks:
  - setup: |
      cd libagar
      meson setup buildDir --buildtype=release --reconfigure -Dtests=true

  - build: |
      cd libagar
      meson compile -C buildDir

